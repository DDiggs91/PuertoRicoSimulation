# Test overrides. Merged over src/main/resources/application.properties, which still supplies
# everything not named here.

# No AI think-time in tests. At the production 300ms every @SpringBootTest that starts a game leaves
# it grinding in background threads for the rest of the suite; at 0 an all-AI game resolves
# immediately and deterministically.
app.ai.think-time-ms=0

# The sweeper is exercised directly by its own test, not on a timer. Pushing the first run past any
# test's lifetime keeps it from evicting a table a test is still using.
app.lobby.sweep-interval-ms=3600000

logging.level.com.PRS=WARN
logging.level.org.springframework=WARN
