# Puerto Rico simulation backend.
#
# Every value below is a default that also lives in the @Value expression that reads it, so the app
# runs unconfigured. They are written out here so the knobs are discoverable without grepping the
# Java, and so a deployment has one obvious place to override them.

spring.application.name=puerto-rico

server.port=8080

# How long an AI "thinks" before answering. Paces an AI-vs-AI game so a spectator can watch it move
# by move rather than seeing a finished board. Playwright's e2e suite overrides this to 20ms and the
# test profile sets it to 0; see WebConfig.
app.ai.think-time-ms=300

# How long a finished, failed, or never-seated table is kept before the sweeper reclaims it along
# with its seat tokens and SSE subscriptions. The delay is what lets a spectator still read the
# final board after a game ends. See GameTableSweeper.
app.lobby.retention-minutes=30
app.lobby.sweep-interval-ms=300000

# Server-sent events are the only long-lived responses here, and their emitters never time out
# (GameEventStream completes them on a terminal event instead), so async requests must not either.
spring.mvc.async.request-timeout=-1

logging.level.com.PRS=INFO
